<!DOCTYPE html>
<html>
<head>

    <title>Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6f9;
            text-align: center;
            padding-top: 100px;
        }

        .result-box {
            width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            color: #333333;
        }

        .prediction {
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #333333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .note {
            margin-top: 30px;
            font-size: 13px;
            color: #666666;
        }
    </style>

</head>

<body>

<div class="result-box">

    <h1>Prediction Result</h1>

    <div class="prediction">
        {{ prediction }}
    </div>

    <a href="/">Check Again</a>

    <p class="note">
        This is an academic screening project and is not a medical diagnosis.
    </p>

</div>

</body>
</html>
